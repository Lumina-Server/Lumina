settings:
  allow-end: true
  warn-on-overload: true
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: 4000
  query-plugins: true

spawn-limits:
  monsters: 70
  animals: 10
  water-animals: 15
  ambient: 15

ticks-per:
  animal-spawns: 400
  monster-spawns: 1
  autosave: 6000

aliases: now-in-commands.yml
